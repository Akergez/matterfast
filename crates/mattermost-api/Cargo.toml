[package]
name = "mattermost-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
futures-util.workspace = true
rand = "0.9.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "stream", "rustls", "http2", "query"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-native-roots", "handshake"] }
tracing.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
url = "2.5.8"
