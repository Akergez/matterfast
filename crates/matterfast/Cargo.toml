[package]
name = "matterfast"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# A shared object as well, which is what an Android activity loads.
[lib]
crate-type = ["lib", "cdylib"]

[build-dependencies]
# Links the icon into the Windows executable (`build.rs`). The same crate,
# at the same version, that GPUI embeds its manifest with.
embed-resource = "3"

[dependencies]
async-channel = "2.5.0"
chrono = "0.4"
chrono-tz = "0.10"
cpal = "0.18.2"
dirs = "6"
matterfast-emoji = { path = "../matterfast-emoji" }
matterfast-paths = { path = "../matterfast-paths" }
matterfast-markdown = { path = "../matterfast-markdown" }
matterfast-timefmt = { path = "../matterfast-timefmt" }
futures-util.workspace = true
# The colours: a Material You scheme from the system's colour as the theme,
# and themes written for the Zed editor for whoever prefers one. Both are
# pinned to the toolkit version below, key by key, and not on crates.io.
# Named by branch, as gpui-adaptive names it, so that there is one copy;
# Cargo.lock holds the revision.
gpui-adaptive-colors = { git = "https://github.com/Akergez/gpui-adaptive-colors", branch = "main" }
gpui-zed-themes = { git = "https://github.com/Akergez/gpui-adaptive-colors", branch = "main" }
# The design system the whole UI is drawn with: intents that draw themselves
# for a pointer or a finger, and the primitives for what is matterfast's own.
# To work on it beside the application, swap this for the path variant.
gpui-adaptive = { git = "https://github.com/Akergez/gpui-mobile-components", tag = "v0.5.0" }
# gpui-adaptive = { path = "../../../gpui-mobile-components/crates/gpui-adaptive" }
gpui-kit = "0.7.0"
# The Android side shared with money-manager-ng and aiddiction: android_main,
# the keyboard, back, the status bar, the insets, links. Every function of it
# also exists off Android. Its Java half is `com.akergez.gpui:android-glue`
# in android/app/build.gradle.kts, at the same version. `platform-verifier`
# hands the activity to rustls-platform-verifier, which reqwest checks
# certificates with. To work on it beside the application, swap this for the
# path variant and build the package with -PglueLocal.
gpui-android-glue = { git = "https://github.com/Akergez/gpui-android-glue", tag = "v0.4.6", features = ["platform-verifier"] }
# gpui-android-glue = { path = "../../../gpui-android-glue", features = ["platform-verifier"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
mattermost-api = { path = "../mattermost-api" }
mattermost-calls = { path = "../mattermost-calls" }
opus = "0.3.1"
rand = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# What only the Linux desktop has: D-Bus for the keyring, notifications and
# the screen-sharing portal, and GStreamer, which the distribution provides.
[target.'cfg(target_os = "linux")'.dependencies]
# Not the `tokio` flavour of either of these: the toolkit talks D-Bus through the
# same `zbus`, on its own executor, and `zbus/tokio` would make every one of its
# calls need a Tokio reactor it does not have.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
gstreamer = "0.24.5"
gstreamer-app = "0.24.5"
gstreamer-video = "0.24.5"

# The Keychain and the Credential Manager in place of the Secret Service, and
# the system's notification service in place of the D-Bus one.
[target.'cfg(not(target_os = "linux"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }
notify-rust = "4"

# A second launch reaches the first through a named pipe, which is Tokio's to
# serve, and the sign-in link scheme is registered in the registry: there is
# no installer to do either.
[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }
windows-registry = "0.6"

# The platform GPUI does not ship: the toolkit is handed one from this fork,
# which tracks the same `gpui-pre` and is not on crates.io at this version.
[target.'cfg(target_os = "android")'.dependencies]
# At the revision gpui-android-glue names: one copy of the platform.
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/Akergez/gpui-mobile", rev = "d924245f173b80ebc8bcc4da5568fc97d3c64c43" }
# To call the Java that raises notifications; the version the fork uses.
jni = "0.22"
# With no subscriber, events go to `log`, and from there to logcat.
tracing = { workspace = true, features = ["log"] }
