           M 3 5 a 1 1 0 1 0 2 0 a 1 1 0 1 0 -2 0 Z
           M 7 5 a 1 1 0 1 0 2 0 a 1 1 0 1 0 -2 0 Z
           M 11 5 a 1 1 0 1 0 2 0 a 1 1 0 1 0 -2 0 Z
           M 3 8 H 13 V 9 H 3 Z"/>
</svg>
