<!--
  ru.toxblh.Matras — symbolic icon (16x16)
  The same mattress-bubble silhouette reduced to one colour: the body with its
  tail, the piping cord knocked out as a seam above the side border, and the
  three tufting buttons knocked out as dots. All features snapped to the 16px
  pixel grid so they stay crisp; the quilting is dropped at this size.
-->
