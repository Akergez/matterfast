# Tests on every merge request and on the default branch. Everything that is
# built to be handed to someone is built from a version tag, and only from
# one: `v1.2.3`, on a commit whose crates all say 1.2.3.
#
# A tag pipeline:
#   test     the unit and UI tests, and the check that tag and crates agree
#   build    flatpak (x86_64, aarch64), Linux tarballs (x86_64, aarch64),
#            a Windows zip (x86_64)
#   publish  the flatpak repository to GitLab Pages; every package to the
#            package registry; a release that links to them
#
# Every job runs on Linux. The Linux builds are native, each architecture on
# its own runner: they link GStreamer, ALSA and the Wayland/X11 stack, and a
# foreign-architecture sysroot for those is more to keep working than a
# second runner. The Windows builds are cross-compiled; see
# build-aux/build-windows.sh for what stands in for a Windows machine.

stages: [test, build, publish]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  # GitLab.com's hosted runners. On a self-managed instance, or with your own
  # machines, override these two in Settings → CI/CD → Variables.
  RUNNER_AMD64: saas-linux-medium-amd64
  RUNNER_ARM64: saas-linux-medium-arm64
  # The toolchain the application is developed with; multi-arch, so the same
  # tag serves both runners.
  RUST_VERSION: "1.95"
  RUST_IMAGE: rust:1.95-bookworm
  # Flathub's build image, pinned by digest, for flatpak-builder. The digest
  # is a multi-arch index, so it resolves to the arm64 image on that runner.
  # It is the GNOME 50 flavour, which is more than this needs; the freedesktop
  # runtime is installed in the job.
  #   skopeo inspect docker://ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
  FLATPAK_IMAGE: ghcr.io/flathub-infra/flatpak-github-actions@sha256:bdbeb241813021cf96f3001ccceea46b8e0c3c46a316172992fd60ad9dfc50e2
  # Rust, clang, lld and cargo-xwin in one image, for the Windows builds.
  XWIN_IMAGE: messense/cargo-xwin:latest
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_TERM_COLOR: always

# ---------------------------------------------------------------- templates

.amd64:
  tags: [$RUNNER_AMD64]

.arm64:
  tags: [$RUNNER_ARM64]

# A build for release. `version` hands over $VERSION, the tag without its
# `v`, and $PACKAGES, where this version's files go in the package registry;
# `test` is named so that nothing is built from a commit that fails it —
# with `needs`, stage order alone would not hold a job back.
.release:
  rules:
    - if: $CI_COMMIT_TAG
  needs: [version, test]

# Puts everything in dist/ into the package registry.
.upload: &upload
  - |
    for file in dist/*; do
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" \
        "$PACKAGES/${file##*/}"
    done

.rust:
  image: $RUST_IMAGE
  before_script:
    # The list in README.md under "Building".
    - apt-get update -q
    - apt-get install -y -q --no-install-recommends
        pkg-config cmake libssl-dev
        libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libvulkan-dev
        libfontconfig-dev libfreetype-dev libasound2-dev
        libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libopus-dev
  cache:
    # Downloaded crates only. `target` is not cached: a dist build is one
    # codegen unit with LTO, so nothing in it survives a source change, and
    # it is several gigabytes to upload after every job.
    key: cargo-registry
    paths:
      - .cargo-home/registry/index
      - .cargo-home/registry/cache

.flatpak:
  stage: build
  image: $FLATPAK_IMAGE
  extends: .release
  # flatpak-builder sandboxes the build with bwrap, which has to create its
  # own namespaces: the runner must run this container privileged. GitLab.com's
  # hosted runners do; on your own runner set `privileged = true`.
  #
  # A dist build is slow, and the project default of one hour is not enough
  # on a small runner.
  timeout: 3h
  # Never let a stale build finish last and publish over a newer one.
  resource_group: flatpak
  before_script:
    # Without a machine id, dbus-run-session refuses to start and
    # flatpak-builder cannot spawn a build sandbox.
    - dbus-uuidgen > /etc/machine-id
    # The image carries the GNOME runtime and SDK; the application builds
    # against the freedesktop ones.
    - flatpak install -y --noninteractive flathub
        org.freedesktop.Platform//25.08
        org.freedesktop.Sdk//25.08
        org.freedesktop.Sdk.Extension.rust-stable//25.08
  script:
    - build-aux/publish-flatpak.sh
  artifacts:
    # The unsigned ostree repository, handed to the next job. It only has to
    # outlive the pipeline.
    paths: [.flatpak-repo]
    expire_in: 1 day

.tarball:
  stage: build
  extends: [.rust, .release]
  timeout: 3h
  script:
    - cargo build --profile dist --locked -p matterfast
    - build-aux/package-tarball.sh "$VERSION"
    - *upload
  artifacts:
    paths: [dist]
    expire_in: 30 days

.windows:
  stage: build
  image: $XWIN_IMAGE
  # Always the x86-64 runner, whichever Windows it builds for: the shader
  # compiler is run through wine, and the build is a cross-compile anyway.
  extends: [.release, .amd64]
  timeout: 3h
  before_script:
    - rustup toolchain install "$RUST_VERSION" --profile minimal --target "$ARCH-pc-windows-msvc"
    - rustup default "$RUST_VERSION"
    - apt-get update -q
    - apt-get install -y -q --no-install-recommends wine nasm git curl unzip zip
  script:
    - build-aux/build-windows.sh "$ARCH" "$VERSION"
    - *upload
  cache:
    # The MSVC runtime and Windows SDK cargo-xwin downloads, and fxc.exe.
    key: windows-sdk
    paths:
      - .xwin-cache
      - target/windows-tools/fxc-*
  variables:
    XWIN_CACHE_DIR: $CI_PROJECT_DIR/.xwin-cache
  artifacts:
    paths: [dist]
    expire_in: 30 days

# --------------------------------------------------------------------- test

test:
  stage: test
  extends: [.rust, .amd64]
  script:
    # What running needs on top of what building needs. The GStreamer plugins
    # are for two unit tests that parse every pipeline the application uses,
    # which only works where the elements they name exist; sway and Mesa's
    # software Vulkan are for the UI scenarios.
    - apt-get install -y -q --no-install-recommends
        gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pipewire
        sway mesa-vulkan-drivers
    - cargo test --workspace --locked
    # The scenarios in crates/matterfast/tests/ui, played into the real
    # application under a headless compositor. In the same job as the unit
    # tests so the dependencies are compiled once.
    - cargo build --locked -p matterfast -p matterfast-testserver
    # sway refuses to start as root.
    - useradd --create-home ui
    - runuser -u ui -- build-aux/ui-tests.sh --headless

# The tag has to be a version, and the version the crates carry. Everything
# built for release waits for this.
version:
  stage: test
  image: $RUST_IMAGE
  extends: .amd64
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION=$(build-aux/check-version.sh "$CI_COMMIT_TAG")
    - echo "VERSION=$VERSION" > version.env
    - echo "PACKAGES=$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/matterfast/$VERSION" >> version.env
  artifacts:
    reports:
      dotenv: version.env

# -------------------------------------------------------------------- build

flatpak:x86_64:
  extends: [.flatpak, .amd64]

flatpak:aarch64:
  extends: [.flatpak, .arm64]
  # Not parallel with x86_64: it builds into the repository that job produced,
  # so one ostree repository ends up holding both architectures.
  needs: [version, test, "flatpak:x86_64"]

tarball:x86_64:
  extends: [.tarball, .amd64]

tarball:aarch64:
  extends: [.tarball, .arm64]

windows:x86_64:
  extends: .windows
  variables:
    ARCH: x86_64

# ------------------------------------------------------------------ publish

# GitLab Pages serves what this job leaves in `public`: the signed ostree
# repository under /repo and the .flatpakref beside it. It also packs each
# architecture as a single-file bundle for the package registry. The signing
# key is needed here and nowhere else; keep its variables masked.
pages:
  stage: publish
  image: $FLATPAK_IMAGE
  extends: [.release, .amd64]
  needs: [version, "flatpak:aarch64"]
  resource_group: flatpak
  variables:
    FLATPAK_REPO_URL: $CI_PAGES_URL/repo
    FLATPAK_HOMEPAGE: $CI_PROJECT_URL
    FLATPAK_BUNDLE_DIR: dist
  script:
    - FLATPAK_BUNDLE_VERSION=$VERSION build-aux/publish-flatpak.sh --site public
    - *upload
  artifacts:
    paths: [public]

release:
  stage: publish
  # The image the `release` keyword needs: the runner calls glab from it.
  image: registry.gitlab.com/gitlab-org/cli:latest
  extends: [.release, .amd64]
  # Every package has to be in the registry before the release links to it.
  needs:
    - version
    - pages
    - "tarball:x86_64"
    - "tarball:aarch64"
    - "windows:x86_64"
  script:
    - echo "Releasing Matterfast $VERSION"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Matterfast $VERSION
    # Plain words only. The runner pastes this text into a shell command, and
    # a backtick, a quote or an angle bracket in it is read by that shell: the
    # first release job died of a syntax error that way. Code is set off by
    # indenting it four spaces, which Markdown also takes for a code block.
    description: |
      ## Install

      **Linux, flatpak**, x86_64 and aarch64, kept up to date by flatpak update:

          flatpak install $CI_PAGES_URL/io.gitlab.akergez.Matterfast.flatpakref

      The .flatpak files below are the same build as a single file, for a machine that cannot reach the repository.

      **Linux, tarball**, laid out like an install prefix. The libraries listed under Building in the README come from the distribution:

          tar -xzf matterfast-$VERSION-linux-x86_64.tar.gz --strip-components=1 -C ~/.local

      **Windows, x86_64**: unpack the zip and run matterfast.exe. This build has no video: attachments do not play and calls are sound only.
    assets:
      links:
        - name: matterfast-$VERSION-x86_64.flatpak
          url: $PACKAGES/matterfast-$VERSION-x86_64.flatpak
          link_type: package
        - name: matterfast-$VERSION-aarch64.flatpak
          url: $PACKAGES/matterfast-$VERSION-aarch64.flatpak
          link_type: package
        - name: matterfast-$VERSION-linux-x86_64.tar.gz
          url: $PACKAGES/matterfast-$VERSION-linux-x86_64.tar.gz
          link_type: package
        - name: matterfast-$VERSION-linux-aarch64.tar.gz
          url: $PACKAGES/matterfast-$VERSION-linux-aarch64.tar.gz
          link_type: package
        - name: matterfast-$VERSION-windows-x86_64.zip
          url: $PACKAGES/matterfast-$VERSION-windows-x86_64.zip
          link_type: package
