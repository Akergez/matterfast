[workspace]
resolver = "2"
members = ["crates/mattermost-api", "crates/mattermost-calls", "crates/matterfast", "crates/matterfast-timefmt", "crates/matterfast-emoji", "crates/matterfast-paths", "crates/matterfast-zed-theme", "crates/matterfast-markdown", "crates/matterfast-testserver"]

[workspace.package]
version = "1.0.6"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
authors = ["Akergez"]
repository = "https://github.com/akergez/matterfast"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
futures-util = "0.3"

[profile.release]
# What `cargo build --release` gives you while working on the application: an
# optimised binary that does not take minutes to rebuild after an edit. On the
# 8-core machine this is developed on, rebuilding after one changed line took
# 195 s under the settings `dist` now has, and takes about 30 s under these.
incremental = true

[profile.dist]
# What gets shipped. Cross-crate inlining matters in an application built from
# many thin Rust wrappers, while thin LTO keeps the build practical. One
# codegen unit gives LLVM a coherent view of the hot UI path and also reduces
# binary size (78 MB against 96 MB). It is slow, and it only has to happen
# once per release: `cargo build --profile dist`, binary in `target/dist`.
inherits = "release"
lto = "thin"
codegen-units = 1
incremental = false
